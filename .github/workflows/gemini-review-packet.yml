name: Export Gemini review packet
on:
  push:
    branches:
      - review/gemini-pr196-group1-20261124
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Combine group 4 evidence
        run: |
          cat review/PR196-Gemini-04A-WorkManager.txt review/PR196-Gemini-04B-Recent-Fixes.txt > PR196-Gemini-04-WorkManager-Full.txt
          wc -lc PR196-Gemini-04-WorkManager-Full.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-PR196-Group4
          path: PR196-Gemini-04-WorkManager-Full.txt
          retention-days: 7
