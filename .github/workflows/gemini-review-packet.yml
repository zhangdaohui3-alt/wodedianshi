name: Export Gemini review packet
on:
  push:
    branches:
      - review/gemini-pr196-group1-20261124
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Export reviewed source as text
        run: |
          cp review/PR196-Gemini-01-Initial-Discovery.md PR196-Gemini-01-Initial-Discovery.txt
          wc -lc PR196-Gemini-01-Initial-Discovery.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-PR196-Group1
          path: PR196-Gemini-01-Initial-Discovery.txt
          retention-days: 7
