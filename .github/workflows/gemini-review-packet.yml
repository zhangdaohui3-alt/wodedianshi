name: Export Gemini review packet
on:
  push:
    branches:
      - review/gemini-pr196-group1-20261124
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Combine group 5 evidence
        run: |
          cat review/PR196-Gemini-05A-Playback-Engines.txt review/PR196-Gemini-05B-Playback-Callsites.txt review/PR196-Gemini-05C-Playback-Tests.txt > PR196-Gemini-05-Playback-Full.txt
          wc -lc PR196-Gemini-05-Playback-Full.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-PR196-Group5
          path: PR196-Gemini-05-Playback-Full.txt
          retention-days: 7
