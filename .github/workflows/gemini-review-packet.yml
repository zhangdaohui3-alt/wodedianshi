name: Export Gemini review packet
on:
  push:
    branches:
      - review/gemini-pr196-group1-20261124
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Combine group 3 evidence into one text file
        run: |
          cat review/PR196-Gemini-03A-Room-Snapshot.txt review/PR196-Gemini-03B-Room-Callsites.txt review/PR196-Gemini-03C-Room-Tests.txt > PR196-Gemini-03-Room-Full-Snapshot.txt
          wc -lc PR196-Gemini-03-Room-Full-Snapshot.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-PR196-Group3
          path: PR196-Gemini-03-Room-Full-Snapshot.txt
          retention-days: 7
