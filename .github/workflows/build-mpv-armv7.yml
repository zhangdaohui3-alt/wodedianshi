name: Build libmpv ARMv7 LGPL audit

on:
  push:
    branches:
      - 'prototype/mpv-armv7-lgpl-audit'
  workflow_dispatch:

concurrency:
  group: mpv-armv7-lgpl-audit
  cancel-in-progress: true

jobs:
  build-armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout My TV research branch
        uses: actions/checkout@v5

      - name: Checkout pinned mpv-android integration source
        uses: actions/checkout@v5
        with:
          repository: mpv-android/mpv-android
          ref: fdf74f6830c47dbaa8a22ac79726e8303f1db5af
          path: mpv-android

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkg-config libtool ninja-build python3-pip gperf nasm git wget unzip

      - name: Install Meson
        run: python3 -m pip install --user --break-system-packages meson

      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            mpv-android/buildscripts/sdk
            mpv-android/buildscripts/deps
            mpv-android/buildscripts/prefix
          key: mpv-armv7-lgpl-v4-lgplv3-${{ hashFiles('.github/workflows/build-mpv-armv7.yml') }}
          restore-keys: |
            mpv-armv7-lgpl-v4-lgplv3-

      - name: Download Android SDK, NDK and source dependencies
        working-directory: mpv-android/buildscripts
        env:
          IN_CI: '1'
          PATH: /home/runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          ./include/download-sdk.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path("include/download-deps.sh")
          text = p.read_text()
          import re
          pattern = r"if \[ ! -d lua \]; then\n.*?\nfi"
          new = """if [ ! -d lua ]; then
          	mkdir lua
          	archive="lua-$v_lua.tar.gz"
          	$WGET "https://mirror.nju.edu.cn/buildroot/lua/$archive" -O "$archive"
          	echo "b9e2e4aad6789b3b63a056d442f7b39f0ecfca3ae0f1fc0ae4e9614401b69f4b  $archive" | sha256sum -c -
          	tar -xz -C lua --strip-components=1 -f "$archive"
          	rm "$archive"
          fi"""
          updated, count = re.subn(pattern, new, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Lua download block changed; refusing an unverified source substitution")
          p.write_text(updated)
          PY
          ./include/download-deps.sh

      - name: Pin native source revisions and select no-GPL LGPLv3 build
        working-directory: mpv-android/buildscripts
        run: |
          set -euo pipefail
          checkout_pinned() {
            repo="$1"
            revision="$2"
            echo "Fetching pinned revision $revision for $repo"
            git -C "$repo" fetch --no-tags --depth=1 origin "$revision"
            git -C "$repo" checkout --detach FETCH_HEAD
            actual="$(git -C "$repo" rev-parse HEAD)"
            case "$actual" in
              "$revision"*) ;;
              *)
                echo "Pinned revision mismatch for $repo: expected prefix $revision, got $actual"
                exit 1
                ;;
            esac
            echo "$repo -> $actual (verified)"
          }
          checkout_pinned deps/ffmpeg 094a2f8a2a5e7fa64736e067de224ce28fdf5979
          checkout_pinned deps/dav1d 362bc1138228390a0a521ecf3af18b23c6afeb9e
          checkout_pinned deps/libass b2fe9d8770678a7b5271387d38c20657ebf3429a
          checkout_pinned deps/libplacebo 3330a515d62139259c26239014f286e233bd3a5c
          git -C deps/libplacebo submodule update --init --recursive
          checkout_pinned deps/mpv 0b7ed670f7c353dd3dd4f8ae0fc788a181a15aa6
          python3 - <<'PY'
          from pathlib import Path
          ffmpeg = Path("scripts/ffmpeg.sh")
          text = ffmpeg.read_text()
          old = "--enable-{gpl,version3}"
          if old not in text:
              raise SystemExit("FFmpeg GPL flag not found; refusing an unaudited build")
          ffmpeg.write_text(text.replace(old, "--disable-gpl --enable-version3"))
          mpv = Path("scripts/mpv.sh")
          text = mpv.read_text()
          old = "-Dlibmpv=true -Dcplayer=false"
          if old not in text:
              raise SystemExit("mpv Meson options not found; refusing an unaudited build")
          mpv.write_text(text.replace(old, "-Dlibmpv=true -Dgpl=false -Dcplayer=false"))
          PY
          grep -n -- '--disable-gpl --enable-version3' scripts/ffmpeg.sh
          grep -n -- '-Dgpl=false' scripts/mpv.sh
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/mpv-android.sh")
          text = script.read_text()
          needle = "ndk-build -C app/src/main -j$cores"
          if needle not in text:
              raise SystemExit("ndk-build insertion point missing; refusing an unverified packaging path")
          copy = needle + "\nmkdir -p app/src/main/jniLibs/armeabi-v7a\ncp -a app/src/main/libs/armeabi-v7a/. app/src/main/jniLibs/armeabi-v7a/"
          script.write_text(text.replace(needle, copy))
          PY

      - name: Build ARMv7 libmpv and reference app
        working-directory: mpv-android/buildscripts
        env:
          PATH: /home/runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          ./buildall.sh --arch armv7l

      - name: Validate ARMv7 APK and LGPLv3 build configuration
        working-directory: mpv-android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/default/debug/app-default-armeabi-v7a-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/libmpv.so$'
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/libplayer.so$'
          if unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "Unexpected non-ARMv7 ABI in ARMv7 audit APK"
            exit 1
          fi
          CONFIG="buildscripts/deps/ffmpeg/_build_armv7l/config.mak"
          test -s "$CONFIG"
          grep -E '^CONFIG_GPL=no$' "$CONFIG"
          grep -E '^CONFIG_VERSION3=yes$' "$CONFIG"
          echo "ARMv7 APK, no-GPL and LGPLv3 FFmpeg configure flags verified."

      - name: Package native engine audit outputs
        working-directory: mpv-android
        env:
          PATH: /home/runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          mkdir -p audit-output
          cp app/build/outputs/apk/default/debug/app-default-armeabi-v7a-debug.apk audit-output/
          tar -czf audit-output/mpv-armv7-native-libs.tar.gz -C app/src/main/libs/armeabi-v7a .
          cp buildscripts/deps/ffmpeg/_build_armv7l/config.mak audit-output/ffmpeg-config.mak
          meson configure buildscripts/deps/mpv/_build_armv7l > audit-output/mpv-meson-config.txt

      - name: Upload libmpv ARMv7 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-ARMv7-LGPLv3-audit
          path: mpv-android/audit-output/*
