name: Build My TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
      - 'upgrade/**'

concurrency:
  group: my-tv-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mytv-debug-signing-v1

      - name: Ensure stable debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify signing key fingerprint
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build universal APK
        run: gradle assembleDebug --stacktrace

      - name: Validate APK package and archive
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          unzip -t "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.wodedianshi.tv'"
          echo "$BADGING" | grep -F "sdkVersion:'23'"
          echo "$BADGING" | grep -F "targetSdkVersion:'28'"
          echo "$BADGING" | grep -F "versionCode='153' versionName='2.71.0'"
          echo "APK archive, package ID, version, minSdk and targetSdk checks passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-TV-APK
          path: app/build/outputs/apk/debug/*.apk

# Build the latest committed source for the current release.
