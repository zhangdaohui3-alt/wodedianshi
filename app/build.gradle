plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wodedianshi.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wodedianshi.tv'
        minSdk 23
        targetSdk 28
        versionCode 148
        versionName '2.66.0'
        // Android TV boxes use ARM; retain both 32-bit and 64-bit ARM for older Dangbei models.
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    // Keep a universal APK for unknown/older TV boxes, and produce smaller
    // per-ABI packages so users can install only the native libraries they need.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.11.1"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:1.11.1"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    // Independent native playback engine; intentionally separate from Media3 renderers.
    implementation "org.videolan.android:libvlc-all:3.7.7"
    implementation "androidx.work:work-runtime:2.10.1"
    testImplementation "junit:junit:4.13.2"
}
